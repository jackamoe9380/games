<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NES Game Library</title>

    <link rel="icon" href="data:,">

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #222;
            color: white;
            font-family: Arial, sans-serif;
        }

        h1 {
            margin: 0 0 8px;
            text-align: center;
        }

        .subtitle {
            margin: 0 0 20px;
            text-align: center;
            color: #aaa;
        }

        /* =========================
           GAME LIST
           ========================= */

        #game-list-screen {
            max-width: 1100px;
            margin: 0 auto;
        }

        #search-container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto 25px;
        }

        #game-search {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #444;
            border-radius: 8px;
            background: #111;
            color: white;
            font-size: 16px;
            outline: none;
        }

        #game-search:focus {
            border-color: #777;
        }

        #game-search::placeholder {
            color: #777;
        }

        #game-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px;
        }

        .game-card {
            background: #333;
            border: 2px solid #444;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition:
                transform 0.15s ease,
                border-color 0.15s ease,
                background 0.15s ease;
        }

        .game-card:hover {
            transform: translateY(-3px);
            border-color: #777;
            background: #3a3a3a;
        }

        .game-card:active {
            transform: translateY(0);
        }

        .game-image {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: contain;
            display: block;
            background: #111;
        }

        .game-name {
            padding: 12px 10px;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
            word-break: break-word;
        }

        #game-status {
            text-align: center;
            color: #aaa;
            padding: 30px 10px;
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            color: #999;
            padding: 30px;
        }

        /* =========================
           GAME SCREEN
           ========================= */

        #game-screen {
            display: none;
            max-width: 1000px;
            margin: 0 auto;
        }

        #game-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        #back-button {
            border: 0;
            border-radius: 8px;
            background: #444;
            color: white;
            padding: 10px 16px;
            font-size: 20px;
            line-height: 1;
            cursor: pointer;
        }

        #back-button:hover {
            background: #555;
        }

        #game-title {
            margin: 0;
            font-size: 22px;
            word-break: break-word;
        }

        /* EmulatorJS container */

        #nes-container {
            width: min(90vw, 768px);
            aspect-ratio: 256 / 240;
            margin: 0 auto;
            background: black;
            border: 4px solid #444;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            position: relative;
        }

        #game {
            width: 100%;
            height: 100%;
        }

        #game-loading {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            color: #aaa;
            text-align: center;
            padding: 20px;
            z-index: 5;
        }

        /* =========================
           CONTROLS
           ========================= */

        #controls-details {
            max-width: 768px;
            margin: 20px auto 0;
            background: #333;
            border: 2px solid #444;
            border-radius: 8px;
            overflow: hidden;
        }

        #controls-details summary {
            padding: 14px 16px;
            cursor: pointer;
            font-weight: bold;
            user-select: none;
        }

        #controls-details summary:hover {
            background: #3a3a3a;
        }

        .controls-content {
            padding: 0 16px 16px;
            color: #ccc;
            line-height: 1.6;
        }

        .controls-content p {
            margin: 8px 0;
        }

        .key {
            display: inline-block;
            padding: 2px 7px;
            margin: 0 2px;
            border: 1px solid #666;
            border-radius: 4px;
            background: #222;
            color: white;
            font-family: monospace;
        }

        .mouse-note {
            color: #aaa;
            font-size: 14px;
        }

        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            #game-list {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 10px;
            }

            .game-name {
                font-size: 13px;
                padding: 9px 6px;
            }

            #game-title {
                font-size: 18px;
            }

            #back-button {
                padding: 9px 13px;
            }

            #nes-container {
                width: 96vw;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         GAME LIST
         ========================= -->

    <section id="game-list-screen">

        <h1>NES Game Library</h1>

        <p class="subtitle">
            Select a game to play
        </p>

        <div id="search-container">
            <input
                type="search"
                id="game-search"
                placeholder="Search games..."
                aria-label="Search games"
                autocomplete="off"
            >
        </div>

        <div id="game-status">
            Loading games...
        </div>

        <div id="game-list"></div>

    </section>


    <!-- =========================
         GAME PLAYER
         ========================= -->

    <section id="game-screen">

        <div id="game-header">

            <button
                id="back-button"
                type="button"
                aria-label="Back to game list"
            >
                ←
            </button>

            <h2 id="game-title"></h2>

        </div>

        <div id="nes-container">

            <div id="game"></div>

            <div id="game-loading">
                Loading game...
            </div>

        </div>


        <!-- =========================
             CONTROLS
             ========================= -->

        <details id="controls-details">

            <summary>
                Controls
            </summary>

            <div class="controls-content">

                <p>
                    <strong>Move:</strong>
                    <span class="key">↑</span>
                    <span class="key">↓</span>
                    <span class="key">←</span>
                    <span class="key">→</span>
                </p>

                <p>
                    <strong>A:</strong>
                    <span class="key">X</span>
                </p>

                <p>
                    <strong>B:</strong>
                    <span class="key">Z</span>
                </p>

                <p>
                    <strong>Start:</strong>
                    <span class="key">Enter</span>
                </p>

                <p>
                    <strong>Select:</strong>
                    <span class="key">Shift</span>
                </p>

                <p class="mouse-note">
                    Click inside the game screen first to make sure the emulator
                    has keyboard focus.
                </p>

                <p class="mouse-note">
                    Mouse controls are not used for normal NES controller input.
                </p>

            </div>

        </details>

    </section>


    <!-- Your game/library code -->
    <script src="rom-loader.js"></script>

</body>
</html>
