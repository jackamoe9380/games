<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NES GAME LIBRARY</title>

    <link rel="icon" href="data:,">

    <!-- JSNES -->
    <script src="https://unpkg.com/jsnes@1.2.1/dist/jsnes.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
        }

        /* -------------------------
           GAME LIST
        ------------------------- */

        #game-list-screen {
            min-height: 100vh;
            padding: 30px;
        }

        #game-list-screen h1 {
            text-align: center;
            margin: 10px 0 30px;
            font-size: 32px;
        }

        #game-list {
            max-width: 900px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
        }

        .game-card {
            background: #222;
            border: 2px solid #444;
            border-radius: 8px;
            padding: 15px;
            cursor: pointer;
            transition: transform 0.15s, background 0.15s, border-color 0.15s;
            text-align: center;
        }

        .game-card:hover {
            transform: scale(1.03);
            background: #333;
            border-color: #777;
        }

        .game-card img {
            width: 100%;
            height: 130px;
            object-fit: contain;
            background: #111;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        .game-name {
            font-size: 18px;
            font-weight: bold;
            word-wrap: break-word;
        }

        #loading {
            text-align: center;
            color: #aaa;
            font-size: 18px;
        }

        #error {
            max-width: 700px;
            margin: 30px auto;
            padding: 20px;
            background: #351818;
            border: 1px solid #722;
            border-radius: 8px;
            display: none;
        }

        /* -------------------------
           GAME SCREEN
        ------------------------- */

        #game-screen {
            display: none;
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background: black;
            z-index: 1000;
        }

        #nes-container {
            position: absolute;
            inset: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: black;
        }

        #nes-container canvas {
            /*
             * Keep the NES's original aspect ratio while
             * making it as large as possible.
             */
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: pixelated;
        }

        #back-button {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 2000;

            background: rgba(0, 0, 0, 0.75);
            color: white;
            border: 2px solid #777;
            border-radius: 8px;

            padding: 10px 16px;
            font-size: 18px;
            cursor: pointer;
        }

        #back-button:hover {
            background: rgba(60, 60, 60, 0.9);
        }

        #game-title {
            position: absolute;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1500;

            background: rgba(0, 0, 0, 0.7);
            padding: 8px 15px;
            border-radius: 6px;

            font-size: 18px;
            font-weight: bold;

            pointer-events: none;
        }

        #game-loading {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;

            color: white;
            font-size: 22px;
            background: black;
            z-index: 1001;
        }
    </style>
</head>

<body>

    <!-- =========================
         GAME LIST
    ========================== -->

    <div id="game-list-screen">

        <h1>NES GAME LIBRARY</h1>

        <div id="loading">
            LOADING GAMES...
        </div>

        <div id="error"></div>

        <div id="game-list"></div>

    </div>


    <!-- =========================
         GAME PLAYER
    ========================== -->

    <div id="game-screen">

        <button id="back-button">← BACK</button>

        <div id="game-title"></div>

        <div id="game-loading">
            LOADING GAME...
        </div>

        <div id="nes-container"></div>

    </div>


    <script src="rom-loader.js"></script>

</body>
</html>
